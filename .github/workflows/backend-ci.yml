name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'aws-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev, 'epic/**' ]
    paths:
      - 'aws-backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aws-backend

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Matches template.yaml's Runtime and the deploy workflow.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: aws-backend/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest
